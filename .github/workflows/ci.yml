name: CI/CD Pipeline — Projeto Aurora Base Governamental

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-ci:
    name: ⚙️ Backend (Go 1.25 + Security + Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Install Vulnerability Scanner (govulncheck)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Security Vulnerability Audit (SAST)
        run: cd backend && govulncheck ./...

      - name: Run Backend Unit Tests
        run: cd backend && go test -v -race -coverprofile=coverage.out ./...

      - name: Verify Go Build (API & Worker)
        run: |
          cd backend
          go build -o /dev/null ./cmd/api
          go build -o /dev/null ./cmd/worker

  frontend-ci:
    name: 🎨 Frontend (Next.js 16 + e-MAG Accessibility + Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: ESLint & e-MAG Accessibility Check
        run: cd frontend && npm run lint

      - name: TypeScript Type Check
        run: cd frontend && npx tsc --noEmit

      - name: Frontend Component Unit Tests
        run: cd frontend && npm test -- --run

      - name: Build Next.js Production Bundle
        run: cd frontend && npm run build

  docker-build-healthcheck:
    name: 🐳 Docker (build + healthcheck de todos os serviços)
    runs-on: ubuntu-latest
    # Roda além de (não em vez de) backend-ci/frontend-ci: `go test`/`npm
    # test` nunca constroem as imagens de runtime nem batem no
    # HEALTHCHECK do docker-compose.yml — foi exatamente por isso que um
    # `wget` ausente na imagem runtime (node:22-bookworm-slim/
    # debian:bookworm-slim não vêm com wget, ao contrário da Alpine
    # anterior) deixou frontend/backend-api/backend-worker permanentemente
    # "unhealthy" sem que nenhum CI verde acusasse (achado de auditoria).
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare local env (.env + chave RSA do login local)
        run: |
          cp .env.example .env
          mkdir -p secrets
          openssl genrsa -out secrets/local_auth_private_key.pem 2048

      - name: Build all images
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml build

      - name: Start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

      - name: Wait for every service to report healthy
        run: |
          services="postgres rabbitmq minio backend-api backend-worker frontend"
          deadline=$((SECONDS + 180))
          for svc in $services; do
            while true; do
              # Recalcula o cid a cada volta (não só antes do loop): logo
              # após `up -d`, "ps -q" pode devolver vazio um instante antes
              # do container existir — se isso caísse direto no fallback
              # "no-healthcheck" do inspect, o loop passava sem esperar
              # nada de verdade.
              cid=$(docker compose -f docker-compose.yml -f docker-compose.dev.yml ps -q "$svc")
              status="starting"
              if [ -n "$cid" ]; then
                status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "no-healthcheck")
              fi
              if [ "$status" = "healthy" ] || [ "$status" = "no-healthcheck" ]; then
                echo "$svc: $status"
                break
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "$svc nunca ficou healthy (último status: $status)"
                docker compose -f docker-compose.yml -f docker-compose.dev.yml logs "$svc"
                exit 1
              fi
              sleep 3
            done
          done

      - name: Dump logs (sempre, ajuda a depurar falhas intermitentes)
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
