name: CI/CD Pipeline — Projeto Aurora Base Governamental

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-ci:
    name: ⚙️ Backend (Go 1.25 + Security + Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Install Vulnerability Scanner (govulncheck)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Security Vulnerability Audit (SAST)
        run: cd backend && govulncheck ./...

      - name: Run Backend Unit Tests
        run: cd backend && go test -v -race -coverprofile=coverage.out ./...

      - name: Verify Go Build (API & Worker)
        run: |
          cd backend
          go build -o /dev/null ./cmd/api
          go build -o /dev/null ./cmd/worker

  frontend-ci:
    name: 🎨 Frontend (Next.js 16 + e-MAG Accessibility + Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: ESLint & e-MAG Accessibility Check
        run: cd frontend && npm run lint

      - name: TypeScript Type Check
        run: cd frontend && npx tsc --noEmit

      - name: Frontend Component Unit Tests
        run: cd frontend && npm test -- --run

      - name: Build Next.js Production Bundle
        run: cd frontend && npm run build
