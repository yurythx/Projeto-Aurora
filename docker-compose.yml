name: projeto-nova
networks:
  nix_internal:
    driver: bridge
volumes:
  postgres_data: null
  rabbitmq_data: null
  sonarqube_db_data: null
  sonarqube_data: null
  sonarqube_extensions: null
  sonarqube_logs: null
  scanning_workspace: null
  minio_data: null
  typesense_data: null
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nix}
      POSTGRES_USER: ${DB_USER:-nix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - nix_internal
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USER:-nix} -d ${DB_NAME:-nix}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-nix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be
        set}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-nix}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    - ./deploy/rabbitmq.conf:/etc/rabbitmq/conf.d/consumer_timeout.conf:ro
    networks:
    - nix_internal
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data
    # 9000 = API S3 (o navegador faz o PUT/GET direto via URL pré-assinada,
    # assinada para MINIO_PUBLIC_URL); 9001 = console web.
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - nix_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    # CORS restrito à origem do frontend (a busca client-side vai direto ao
    # Typesense com uma chave RESTRITA a documents:search). Sobrescreva
    # TYPESENSE_CORS_DOMAINS por deploy. --api-key é a chave ADMIN: em
    # produção o backend recusa iniciar se ainda for o default 'xyz123secret'.
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY:-xyz123secret}
      --enable-cors
      --cors-domains=${TYPESENSE_CORS_DOMAINS:-http://localhost:3000,http://127.0.0.1:3000}
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-xyz123secret}
      TYPESENSE_DATA_DIR: /data
    volumes:
      - typesense_data:/data
    networks:
      - nix_internal
    ports:
      - "8108:8108"
    healthcheck:
      # A imagem typesense/typesense não tem curl/wget/nc — só bash. Um
      # connect TCP via /dev/tcp confirma que o servidor está aceitando
      # conexões (o healthcheck com curl ficava sempre 'unhealthy').
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8108"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
    - .env
    environment:
      DB_HOST: postgres
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-nix}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-nix}
      SCANNING_TRIVY_SERVICE_URL: http://trivy-scanner:8080
      SCANNING_GITLEAKS_SERVICE_URL: http://gitleaks-scanner:8080
      SCANNING_SYFT_SERVICE_URL: http://syft-scanner:8080
      SCANNING_SEMGREP_SERVICE_URL: http://semgrep-scanner:8080
      SCANNING_SONAR_SCANNER_SERVICE_URL: http://sonar-scanner-cli:8080
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      # Host do MinIO alcançável pelo NAVEGADOR — as URLs pré-assinadas de
      # upload/download são assinadas para este endereço (o container fala
      # "minio:9000", o navegador não resolve esse nome).
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-demands}
      MINIO_USE_SSL: "false"
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-xyz123secret}
    volumes:
    - ./secrets:/run/secrets:ro
    networks:
    - nix_internal
    ports:
    - ${HTTP_PORT:-8000}:${HTTP_PORT:-8000}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:${HTTP_PORT:-8000}/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    extra_hosts:
    - host.docker.internal:host-gateway
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
    - .env
    environment:
      DB_HOST: postgres
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-nix}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-nix}
      SCANNING_TRIVY_SERVICE_URL: http://trivy-scanner:8080
      SCANNING_GITLEAKS_SERVICE_URL: http://gitleaks-scanner:8080
      SCANNING_SYFT_SERVICE_URL: http://syft-scanner:8080
      SCANNING_SEMGREP_SERVICE_URL: http://semgrep-scanner:8080
      SCANNING_SONAR_SCANNER_SERVICE_URL: http://sonar-scanner-cli:8080
      SCANNING_WORKSPACE_DIR: /workspace
      # O worker roda o pipeline do Diário Oficial (ingestão + indexação no
      # Typesense). Sem estes overrides ele herdava TYPESENSE_URL=localhost:8108
      # do .env, que dentro do container não é o serviço typesense — e toda
      # indexação falhava em silêncio (coleções ficavam vazias).
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-xyz123secret}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-demands}
      MINIO_USE_SSL: "false"
      # Mesmo host público do backend-api — o worker também assina URLs
      # pré-assinadas (pacote .zip / geração de documentos da demanda).
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
    volumes:
    - ./secrets:/run/secrets:ro
    - scanning_workspace:/workspace
    networks:
    - nix_internal
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:${WORKER_METRICS_PORT:-9100}/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    extra_hosts:
    - host.docker.internal:host-gateway
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${WEBSOCKET_PUBLIC_URL:-ws://localhost:8000/ws}
        NEXT_PUBLIC_TYPESENSE_URL: ${TYPESENSE_PUBLIC_URL:-http://localhost:8108}
        NEXT_PUBLIC_MINIO_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
    restart: unless-stopped
    env_file:
    - .env
    environment:
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${WEBSOCKET_PUBLIC_URL:-ws://localhost:8000/ws}
      NEXT_PUBLIC_TYPESENSE_URL: ${TYPESENSE_PUBLIC_URL:-http://localhost:8108}
      NEXT_PUBLIC_MINIO_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      BACKEND_INTERNAL_URL: http://backend-api:8000
    networks:
    - nix_internal
    ports:
    - 3000:3000
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:3000
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    extra_hosts:
    - host.docker.internal:host-gateway
