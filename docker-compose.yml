name: projeto-aurora
networks:
  aurora_internal:
    driver: bridge
volumes:
  postgres_data: null
  rabbitmq_data: null
  minio_data: null
services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aurora}
      POSTGRES_USER: ${DB_USER:-aurora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - aurora_internal
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USER:-aurora} -d ${DB_NAME:-aurora}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-aurora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be
        set}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-aurora}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    - ./deploy/rabbitmq.conf:/etc/rabbitmq/conf.d/consumer_timeout.conf:ro
    networks:
    - aurora_internal
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - check_port_connectivity
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data
    ports:
      - "${HOST_MINIO_PORT:-9002}:9000"
      - "${HOST_MINIO_CONSOLE_PORT:-9003}:9001"
    networks:
      - aurora_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
    - .env
    environment:
      HTTP_PORT: ${HTTP_PORT:-8002}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3002}
      DB_PORT: 5432
      DB_HOST: postgres
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-aurora}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-aurora}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9002}
      MINIO_BUCKET: ${MINIO_BUCKET:-aurora}
      MINIO_USE_SSL: "false"
    volumes:
    - ./secrets:/run/secrets:ro
    networks:
    - aurora_internal
    ports:
    - ${HTTP_PORT:-8002}:${HTTP_PORT:-8002}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:${HTTP_PORT:-8002}/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    extra_hosts:
    - host.docker.internal:host-gateway
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
    - .env
    environment:
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9102}
      DB_PORT: 5432
      DB_HOST: postgres
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-aurora}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-aurora}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-aurora}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9002}
    volumes:
    - ./secrets:/run/secrets:ro
    networks:
    - aurora_internal
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:${WORKER_METRICS_PORT:-9102}/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    extra_hosts:
    - host.docker.internal:host-gateway
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8002}
        NEXT_PUBLIC_WS_URL: ${WEBSOCKET_PUBLIC_URL:-ws://localhost:8002/ws}
        NEXT_PUBLIC_MINIO_URL: ${MINIO_PUBLIC_URL:-http://localhost:9002}
    restart: unless-stopped
    env_file:
    - .env
    environment:
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8002}
      NEXT_PUBLIC_WS_URL: ${WEBSOCKET_PUBLIC_URL:-ws://localhost:8002/ws}
      NEXT_PUBLIC_MINIO_URL: ${MINIO_PUBLIC_URL:-http://localhost:9002}
      BACKEND_INTERNAL_URL: http://backend-api:${HTTP_PORT:-8002}
      # Sem isto, o NextAuth infere a origem sozinho e (achado de
      # auditoria) acerta a porta INTERNA do container (3000) em vez da
      # porta publicada (${FRONTEND_PORT:-3002}) — todo redirecionamento
      # absoluto que o NextAuth monta (o pós-login, e o pós-logout via
      # /api/auth/keycloak-logout-url) mandava o navegador pra
      # http://0.0.0.0:3000 ou http://localhost:3000, inalcançável de
      # fora do container → "página não encontrada" no lugar da home.
      # Reaproveita FRONTEND_URL, a mesma variável que o backend-api já
      # usa pro CORS (única fonte da verdade pra "qual é a URL pública do
      # frontend").
      NEXTAUTH_URL: ${FRONTEND_URL:-http://localhost:3002}
    networks:
    - aurora_internal
    ports:
    - ${FRONTEND_PORT:-3002}:3000
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:3000
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    extra_hosts:
    - host.docker.internal:host-gateway
